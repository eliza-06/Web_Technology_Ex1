<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Yoga Studio Registration Form</h2>

<form action="#" method="post">

    <fieldset>

        <legend>Member Details</legend>

        <label>Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter your email"><br><br>

        <label>Password:</label><br>
        <input type="password"><br><br>

        <label>Phone Number:</label><br>
        <input type="tel"><br><br>

        <label>Age:</label><br>
        <input type="number"><br><br>

        <label>Date of Joining:</label><br>
        <input type="date"><br><br>

        <label>Preferred Batch:</label><br>
        <select>
            <option>Morning</option>
            <option>Evening</option>
        </select><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br><br>

        <label>Yoga Interests:</label><br>
        <input type="checkbox"> Meditation
        <input type="checkbox"> Hatha Yoga
        <input type="checkbox"> Power Yoga<br><br>

        <label>Upload Photo:</label><br>
        <input type="file"><br><br>

        <label>Address:</label><br>
        <textarea rows="4" cols="30"></textarea><br><br>

        <label>Registration Progress:</label><br>
        <progress value="70" max="100"></progress><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </fieldset>

</form>

<hr>

<h2>Yoga Studio Media</h2>

<h3>Meditation Music</h3>

<audio controls>
    <source src="audio/meditation.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<br><br>

<h3>Yoga Tutorial Video</h3>

<video width="400" controls>
    <source src="video/yoga.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<br><br>

<h3>Yoga Guide (PDF)</h3>

<embed src="pdf/YogaGuide.pdf" width="400" height="300">

<br><br>

<h3>Studio Location</h3>

<iframe
    src="https://www.google.com/maps/embed?pb="
    width="400"
    height="300">
</iframe>
</body>
</html>
